<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="upperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="formstripGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="midsoleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>

  <!-- Shadow -->
  <ellipse cx="400" cy="535" rx="170" ry="22" fill="url(#shadowGrad)"/>

  <!-- Top-down shoe shape -->
  <g transform="translate(400, 280)">
    <!-- Outsole outline (wider platform) -->
    <ellipse cx="0" cy="30" rx="160" ry="240" fill="#9ca3af"/>

    <!-- Midsole ring -->
    <ellipse cx="0" cy="25" rx="148" ry="228" fill="url(#midsoleGrad)"/>

    <!-- NITRO foam dots on midsole -->
    <g fill="#fbbf24" opacity="0.6">
      <circle cx="-120" cy="0" r="3"/>
      <circle cx="100" cy="30" r="3.5"/>
      <circle cx="-80" cy="-60" r="2.5"/>
      <circle cx="130" cy="-40" r="3"/>
      <circle cx="-60" cy="-100" r="2"/>
      <circle cx="140" cy="-80" r="3"/>
      <circle cx="40" cy="-120" r="3.5"/>
      <circle cx="-140" cy="80" r="2.5"/>
      <circle cx="-100" cy="120" r="3"/>
      <circle cx="80" cy="140" r="2"/>
      <circle cx="120" cy="110" r="3"/>
      <circle cx="-40" cy="160" r="3.5"/>
      <circle cx="0" cy="-140" r="2.5"/>
      <circle cx="-120" cy="-30" r="2"/>
      <circle cx="110" cy="-10" r="2.5"/>
    </g>

    <!-- Upper body -->
    <ellipse cx="0" cy="20" rx="138" ry="218" fill="url(#upperGrad)"/>

    <!-- Toe box shaping -->
    <ellipse cx="0" cy="-170" rx="90" ry="50" fill="#f3f4f6" opacity="0.5"/>

    <!-- Ventilation mesh pattern -->
    <g fill="none" stroke="#d1d5db" stroke-width="0.8" opacity="0.4">
      <!-- Horizontal mesh lines -->
      <ellipse cx="0" cy="-120" rx="110" ry="4"/>
      <ellipse cx="0" cy="-90" rx="120" ry="4"/>
      <ellipse cx="0" cy="-60" rx="125" ry="4"/>
      <ellipse cx="0" cy="-30" rx="130" ry="4"/>
      <ellipse cx="0" cy="0" rx="132" ry="4"/>
      <ellipse cx="0" cy="30" rx="130" ry="4"/>
      <ellipse cx="0" cy="60" rx="125" ry="4"/>
      <ellipse cx="0" cy="90" rx="115" ry="4"/>
      <ellipse cx="0" cy="120" rx="100" ry="4"/>
    </g>

    <!-- Formstrip visible on left side -->
    <path d="M-138,20 Q-100,-30 -80,-60 Q-60,-90 -50,-100 L-36,-101 Q-44,-88 -58,-58 Q-72,-28 -118,25 Z" fill="url(#formstripGrad)"/>

    <!-- Formstrip on right side -->
    <path d="M138,25 Q100,-20 85,-50 Q70,-80 60,-95 L46,-96 Q54,-83 68,-55 Q82,-25 118,30 Z" fill="url(#formstripGrad)"/>

    <!-- Tongue area -->
    <ellipse cx="0" cy="150" rx="60" ry="40" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1.5"/>

    <!-- Lace system - center line -->
    <line x1="0" y1="160" x2="0" y2="-50" stroke="#1e1e1e" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,6"/>

    <!-- Eyelets -->
    <g fill="#1e1e1e" opacity="0.5">
      <circle cx="-15" cy="140" r="3.5"/>
      <circle cx="15" cy="140" r="3.5"/>
      <circle cx="-20" cy="115" r="3.5"/>
      <circle cx="20" cy="115" r="3.5"/>
      <circle cx="-25" cy="90" r="3.5"/>
      <circle cx="25" cy="90" r="3.5"/>
      <circle cx="-28" cy="65" r="3.5"/>
      <circle cx="28" cy="65" r="3.5"/>
      <circle cx="-30" cy="40" r="3.5"/>
      <circle cx="30" cy="40" r="3.5"/>
      <circle cx="-30" cy="15" r="3.5"/>
      <circle cx="30" cy="15" r="3.5"/>
    </g>

    <!-- Lace zigzag -->
    <g fill="none" stroke="#1e1e1e" stroke-width="2" opacity="0.5">
      <polyline points="-15,140 15,140"/>
      <polyline points="15,140 -20,115"/>
      <polyline points="-20,115 20,115"/>
      <polyline points="20,115 -25,90"/>
      <polyline points="-25,90 25,90"/>
      <polyline points="25,90 -28,65"/>
      <polyline points="-28,65 28,65"/>
      <polyline points="28,65 -30,40"/>
    </g>

    <!-- NITRO branding -->
    <text x="-40" y="0" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#f97316" opacity="0.7">NITRO</text>

    <!-- Toe cap line -->
    <path d="M-80,-170 Q0,-190 80,-170" fill="none" stroke="#d1d5db" stroke-width="1" opacity="0.4"/>

    <!-- Vent dots -->
    <g fill="#d1d5db" opacity="0.3">
      <circle cx="-60" cy="-145" r="2"/>
      <circle cx="-30" cy="-150" r="2"/>
      <circle cx="0" cy="-152" r="2"/>
      <circle cx="30" cy="-150" r="2"/>
      <circle cx="60" cy="-145" r="2"/>
    </g>
  </g>

  <text x="400" y="750" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="#1e1e1e" text-anchor="middle">PUMA Velocity NITRO 3</text>
  <text x="400" y="775" font-family="Arial,sans-serif" font-weight="400" font-size="12" fill="#9ca3af" text-anchor="middle">Running Shoe — Top-Down View</text>
</svg>