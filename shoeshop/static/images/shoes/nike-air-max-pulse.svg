<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <!-- Shadow -->
  <ellipse cx="380" cy="700" rx="260" ry="24" fill="rgba(0,0,0,0.08)"/>
  <!-- Sole -->
  <path d="M160 620 Q160 660 200 660 L580 660 Q640 660 640 630 Q640 590 630 580 L620 620 L160 620Z" fill="url(#sole)"/>
  <path d="M160 620 L620 620 Q630 590 640 580 L640 560 L160 560Z" fill="url(#sole)"/>
  <!-- Midsole wedge -->
  <path d="M160 560 L640 560 Q660 540 660 500 L160 500Z" fill="#d1d5db"/>
  <!-- Heel counter -->
  <path d="M160 200 Q150 300 155 370 Q160 440 160 500 L260 500 Q260 400 250 280 Q245 220 240 200Z" fill="url(#body)"/>
  <!-- Upper body -->
  <path d="M240 200 Q250 160 300 140 Q380 110 480 120 Q560 130 620 170 Q660 200 670 260 Q680 300 680 350 Q680 450 660 500 L160 500 Q160 400 155 370 Q160 300 160 200Z" fill="url(#body)"/>
  <!-- Toe cap -->
  <path d="M620 170 Q660 200 670 260 Q680 300 680 350 Q680 380 675 400 L640 400 Q640 300 620 250Z" fill="#e5e5e5"/>
  <!-- Mesh texture lines -->
  <path d="M320 220 Q380 180 480 180" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M310 260 Q380 220 500 220" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M300 300 Q380 260 520 270" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M290 340 Q380 300 540 320" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <!-- Swoosh -->
  <path d="M350 280 Q420 220 560 180 Q600 165 640 175 Q620 190 580 210 Q500 250 430 300 Q380 340 350 280Z" fill="url(#swoosh)"/>
  <!-- Air Max window (heel) -->
  <ellipse cx="200" cy="540" rx="30" ry="16" fill="url(#accent)" stroke="#dc2626" stroke-width="2"/>
  <ellipse cx="200" cy="540" rx="20" ry="10" fill="#fca5a5" opacity="0.6"/>
  <!-- Collar padding -->
  <path d="M160 200 Q170 160 210 140 L240 200Z" fill="#e5e5e5"/>
  <!-- Tongue -->
  <path d="M340 120 Q360 80 390 75 Q420 72 440 80 Q460 90 460 110 L460 160 Q440 150 400 150 Q360 150 340 160Z" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Lace eyelets -->
  <circle cx="320" cy="190" r="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="340" cy="210" r="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="360" cy="230" r="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="380" cy="250" r="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="400" cy="270" r="6" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
  <!-- Lace lines -->
  <path d="M320 190 L390 180" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M340 210 L400 200" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M360 230 L410 220" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M380 250 L420 240" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M400 270 L440 260" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <!-- NIKE text -->
  <text x="400" y="460" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="8">NIKE</text>
  <text x="400" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="4">AIR MAX PULSE</text>
</svg>
