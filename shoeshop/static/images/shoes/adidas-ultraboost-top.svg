<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fafb"/><stop offset="100%" stop-color="#f3f4f6"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5f5f5"/><stop offset="100%" stop-color="#e8e8e8"/></linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e1e1e"/><stop offset="100%" stop-color="#4b5563"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <ellipse cx="400" cy="680" rx="140" ry="40" fill="rgba(0,0,0,0.06)"/>
  <!-- Sole outline -->
  <path d="M220 580 Q200 560 200 520 Q200 320 220 280 Q260 240 350 230 Q450 220 540 230 Q620 240 640 280 Q660 320 660 520 Q660 560 640 580 L580 540 L220 540Z" fill="#e5e7eb" opacity="0.3"/>
  <!-- Upper top shape -->
  <path d="M230 540 Q210 500 210 460 Q210 340 240 290 Q280 260 360 250 Q460 245 540 255 Q610 265 630 300 Q650 350 650 460 Q650 500 630 540Z" fill="url(#body)"/>
  <!-- Toe top -->
  <path d="M630 300 Q650 350 650 460 Q650 500 630 540 Q580 540 540 295 Q610 265 630 300Z" fill="#d4d4d4"/>
  <!-- Tongue -->
  <path d="M340 245 Q360 210 400 200 Q440 195 460 205 L480 235 L480 260 Q350 260 340 260Z" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Center stitching -->
  <path d="M250 420 Q350 300 550 300" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="8,4" fill="none"/>
  <!-- Mesh lines -->
  <path d="M280 330 Q380 290 500 290" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M270 370 Q380 330 520 330" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M260 410 Q380 370 540 370" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M250 450 Q380 410 560 410" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M240 490 Q380 450 580 450" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <!-- 3 Stripes from top -->
  <rect x="300" y="340" width="250" height="5" rx="2" fill="url(#stripe)"/>
  <rect x="290" y="365" width="260" height="5" rx="2" fill="url(#stripe)"/>
  <rect x="280" y="390" width="270" height="5" rx="2" fill="url(#stripe)"/>
  <!-- Laces -->
  <path d="M340 280 L460 280" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M330 305 L460 305" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M330 330 L460 330" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M330 355 L460 355" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <path d="M330 380 L460 380" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <!-- Collar opening -->
  <path d="M240 400 Q250 340 290 300 Q330 270 360 260 L360 540 L250 540Z" fill="#d4d4d4" opacity="0.5"/>
</svg>
