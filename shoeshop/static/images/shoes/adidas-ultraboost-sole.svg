<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9fafb"/><stop offset="100%" stop-color="#f3f4f6"/></linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#9ca3af"/></linearGradient>
    <linearGradient id="tread" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d1d5db"/><stop offset="100%" stop-color="#9ca3af"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <!-- Outsole shape -->
  <path d="M200 380 Q180 330 185 260 Q190 190 230 150 Q280 110 360 100 Q440 90 520 100 Q590 110 620 145 Q650 180 655 250 Q660 320 640 380 Q620 440 610 460 Q580 500 530 515 Q480 530 400 530 Q320 530 270 515 Q230 500 210 460 Q190 440 200 380Z" fill="url(#sole)"/>
  <!-- Heel tread -->
  <path d="M220 380 Q210 400 210 440 Q210 470 230 480 Q280 510 360 515 Q440 520 530 505 Q570 495 590 470 Q610 445 610 410 Q615 380 620 370" fill="url(#tread)"/>
  <!-- Continental rubber logo -->
  <text x="320" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#6b7280" text-anchor="middle">CONTINENTAL</text>
  <rect x="270" y="420" width="100" height="24" rx="4" fill="none" stroke="#6b7280" stroke-width="1" opacity="0.5"/>
  <!-- Stretchweb pattern - diamond grid -->
  <path d="M400 220 L420 250 L440 220 L460 250 L480 220 L500 250 L520 220 L540 250 L560 220 L580 250 L600 220" stroke="url(#tread)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M390 280 L410 310 L430 280 L450 310 L470 280 L490 310 L510 280 L530 310 L550 280 L570 310 L590 280 L610 310" stroke="url(#tread)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M395 250 L415 280 L435 250 L455 280 L475 250 L495 280 L515 250 L535 280 L555 250 L575 280 L595 250 L610 280" stroke="url(#tread)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Boost indicator -->
  <circle cx="480" cy="160" r="16" fill="white" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="530" cy="170" r="16" fill="white" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="580" cy="195" r="16" fill="white" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="610" cy="230" r="16" fill="white" stroke="#d1d5db" stroke-width="2"/>
  <!-- Torsion bar -->
  <rect x="370" y="360" width="100" height="8" rx="4" fill="#9ca3af"/>
  <!-- Brand -->
  <text x="400" y="620" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#6b7280" text-anchor="middle" letter-spacing="4">ADIDAS</text>
  <text x="400" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="middle">ULTRABOOST OUTSOLE</text>
</svg>
