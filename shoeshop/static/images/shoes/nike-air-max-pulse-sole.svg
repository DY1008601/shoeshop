<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sole" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#9ca3af"/></linearGradient>
    <linearGradient id="tread" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d1d5db"/><stop offset="100%" stop-color="#9ca3af"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <!-- Outsole shape -->
  <path d="M200 380 Q180 330 185 260 Q190 190 230 150 Q280 110 360 100 Q440 90 520 100 Q590 110 620 145 Q650 180 655 250 Q660 320 640 380 Q620 440 610 460 Q580 500 530 515 Q480 530 400 530 Q320 530 270 515 Q230 500 210 460 Q190 440 200 380Z" fill="url(#sole)"/>
  <!-- Heel tread block -->
  <path d="M220 380 Q210 400 210 440 Q210 470 230 480 Q280 510 360 515 Q440 520 530 505 Q570 495 590 470 Q610 445 610 410 Q615 380 620 370" fill="url(#tread)"/>
  <!-- Air Max window (heel, bottom view) -->
  <ellipse cx="320" cy="430" rx="40" ry="25" fill="url(#air)" opacity="0.8"/>
  <ellipse cx="320" cy="430" rx="25" ry="14" fill="#fca5a5" opacity="0.5"/>
  <text x="320" y="438" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">AIR</text>
  <!-- Forefoot tread pattern - zigzag -->
  <path d="M400 220 L420 250 L440 220 L460 250 L480 220 L500 250 L520 220 L540 250 L560 220 L580 250 L600 220" stroke="url(#tread)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M390 280 L410 310 L430 280 L450 310 L470 280 L490 310 L510 280 L530 310 L550 280 L570 310 L590 280 L610 310" stroke="url(#tread)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Arch area -->
  <path d="M380 340 Q450 380 500 370" stroke="#9ca3af" stroke-width="3" fill="none"/>
  <!-- Toe tread pattern - circular -->
  <circle cx="480" cy="160" r="18" fill="none" stroke="url(#tread)" stroke-width="10"/>
  <circle cx="530" cy="170" r="18" fill="none" stroke="url(#tread)" stroke-width="10"/>
  <circle cx="580" cy="195" r="18" fill="none" stroke="url(#tread)" stroke-width="10"/>
  <circle cx="610" cy="230" r="18" fill="none" stroke="url(#tread)" stroke-width="10"/>
  <!-- Wafer grip pattern -->
  <line x1="420" y1="380" x2="420" y2="440" stroke="#9ca3af" stroke-width="3"/>
  <line x1="450" y1="375" x2="450" y2="445" stroke="#9ca3af" stroke-width="3"/>
  <line x1="480" y1="370" x2="480" y2="450" stroke="#9ca3af" stroke-width="3"/>
  <line x1="510" y1="365" x2="510" y2="450" stroke="#9ca3af" stroke-width="3"/>
  <line x1="540" y1="360" x2="540" y2="440" stroke="#9ca3af" stroke-width="3"/>
  <line x1="570" y1="355" x2="570" y2="420" stroke="#9ca3af" stroke-width="3"/>
  <!-- NIKE text -->
  <text x="400" y="620" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#6b7280" text-anchor="middle" letter-spacing="6">NIKE</text>
  <text x="400" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="middle">AIR MAX PULSE OUTSOLE</text>
</svg>
