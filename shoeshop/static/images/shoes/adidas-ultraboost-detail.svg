<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f3f4f6"/><stop offset="100%" stop-color="#f9fafb"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="url(#bg)"/>
  <!-- Boost circles detail -->
  <circle cx="150" cy="150" r="8" fill="#d1d5db" opacity="0.3"/>
  <circle cx="650" cy="100" r="8" fill="#d1d5db" opacity="0.3"/>
  <circle cx="700" cy="600" r="8" fill="#d1d5db" opacity="0.3"/>
  <circle cx="100" cy="650" r="8" fill="#d1d5db" opacity="0.3"/>
  <!-- Giant 3 stripes -->
  <rect x="150" y="280" width="500" height="20" rx="10" fill="#1e1e1e"/>
  <rect x="180" y="320" width="440" height="20" rx="10" fill="#1e1e1e"/>
  <rect x="210" y="360" width="380" height="20" rx="10" fill="#1e1e1e"/>
  <!-- ADIDAS text -->
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#1e1e1e" text-anchor="middle" letter-spacing="12">ADIDAS</text>
  <!-- Boost label -->
  <rect x="250" y="500" width="300" height="50" rx="25" fill="#d1d5db"/>
  <text x="400" y="534" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e1e1e" text-anchor="middle" letter-spacing="8">BOOST</text>
  <!-- Torsion system -->
  <rect x="320" y="580" width="160" height="10" rx="5" fill="#6b7280"/>
  <text x="400" y="610" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">TORSION SYSTEM</text>
  <text x="400" y="660" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="6">ULTRABOOST LIGHT</text>
</svg>
