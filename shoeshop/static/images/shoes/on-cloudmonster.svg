<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <ellipse cx="380" cy="700" rx="260" ry="24" fill="rgba(0,0,0,0.08)"/>
  <!-- Sole -->
  <path d="M160 620 Q160 660 200 660 L580 660 Q640 660 640 630 Q640 590 630 580 L620 620 L160 620Z" fill="url(#sole)"/>
  <path d="M160 620 L620 620 Q630 590 640 580 L640 560 L160 560Z" fill="url(#sole)"/>
  <!-- CloudTec pods (individual "clouds") -->
  <path d="M160 560 Q180 535 210 560 Q240 535 270 560 Q300 535 330 560 Q360 535 390 560 Q420 535 450 560 Q480 535 510 560 Q540 535 570 560 Q600 535 630 560 L650 500 L160 500Z" fill="url(#cloud)"/>
  <!-- CloudTec gaps -->
  <path d="M190 558 L190 500" stroke="#d1d5db" stroke-width="3"/>
  <path d="M250 558 L250 500" stroke="#d1d5db" stroke-width="3"/>
  <path d="M310 558 L310 500" stroke="#d1d5db" stroke-width="3"/>
  <path d="M370 558 L370 500" stroke="#d1d5db" stroke-width="3"/>
  <path d="M430 558 L430 500" stroke="#d1d5db" stroke-width="3"/>
  <path d="M490 558 L490 500" stroke="#d1d5db" stroke-width="3"/>
  <path d="M550 558 L550 500" stroke="#d1d5db" stroke-width="3"/>
  <!-- Heel -->
  <path d="M160 200 Q150 300 155 370 Q160 440 160 500 L260 500 Q260 400 250 270 Q245 220 240 200Z" fill="url(#body)"/>
  <!-- Upper (minimalist, engineered mesh) -->
  <path d="M240 200 Q255 160 300 140 Q380 110 480 120 Q560 130 620 170 Q660 200 670 260 Q680 300 680 350 Q680 440 670 500 L160 500 Q160 400 155 370 Q160 300 160 200Z" fill="url(#body)"/>
  <!-- Toe cap -->
  <path d="M620 170 Q660 200 670 260 Q680 300 680 350 Q680 380 675 400 L640 400 Q640 300 620 250Z" fill="#d4d4d4"/>
  <!-- Engineered mesh pattern -->
  <path d="M320 220 Q380 180 480 180" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M310 260 Q380 220 500 220" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M300 300 Q380 260 520 270" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M290 340 Q380 300 540 320" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M330 240 Q380 200 490 200" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M320 280 Q380 240 510 240" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M310 320 Q380 280 530 300" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <!-- Green accent line -->
  <path d="M260 400 Q400 430 600 400" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <!-- Collar -->
  <path d="M160 200 Q170 155 210 135 L240 200Z" fill="#d4d4d4"/>
  <!-- Tongue -->
  <path d="M340 115 Q360 75 390 72 Q420 70 440 78 Q460 88 460 108 L460 150 Q440 140 400 140 Q360 140 340 150Z" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Speed lacing system -->
  <circle cx="315" cy="185" r="5" fill="#d1d5db"/>
  <circle cx="340" cy="205" r="5" fill="#d1d5db"/>
  <circle cx="365" cy="225" r="5" fill="#d1d5db"/>
  <circle cx="390" cy="245" r="5" fill="#d1d5db"/>
  <circle cx="415" cy="265" r="5" fill="#d1d5db"/>
  <!-- Laces -->
  <path d="M315 185 L380 175" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M340 205 L395 195" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M365 225 L410 215" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M390 245 L425 235" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M415 265 L445 255" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <!-- On logo (Swiss flag dot) -->
  <circle cx="500" cy="240" r="10" fill="#22c55e"/>
  <!-- Text -->
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#374151" text-anchor="middle" letter-spacing="6">ON</text>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="4">CLOUDMONSTER</text>
</svg>
