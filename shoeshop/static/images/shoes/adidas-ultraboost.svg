<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#404040"/>
    </linearGradient>
    <linearGradient id="boost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <ellipse cx="380" cy="700" rx="260" ry="24" fill="rgba(0,0,0,0.08)"/>
  <!-- Sole -->
  <path d="M160 620 Q160 660 200 660 L580 660 Q640 660 640 630 Q640 590 630 580 L620 620 L160 620Z" fill="url(#sole)"/>
  <path d="M160 620 L620 620 Q630 590 640 580 L640 560 L160 560Z" fill="url(#sole)"/>
  <!-- Boost midsole (bumpy) -->
  <path d="M160 510 Q180 500 200 510 Q220 500 240 510 Q260 500 280 510 Q300 500 320 510 Q340 500 360 510 Q380 500 400 510 Q420 500 440 510 Q460 500 480 510 Q500 500 520 510 Q540 500 560 510 Q580 500 600 510 Q620 500 640 510 L660 560 L160 560Z" fill="url(#boost)"/>
  <!-- Heel -->
  <path d="M160 200 Q150 300 155 370 Q160 440 160 510 L250 510 Q250 400 240 280 Q235 220 230 200Z" fill="url(#body)"/>
  <!-- Upper -->
  <path d="M230 200 Q245 160 290 140 Q370 110 470 120 Q550 130 610 170 Q650 200 660 260 Q670 300 670 350 Q670 440 660 510 L160 510 Q160 400 155 370 Q160 300 160 200Z" fill="url(#body)"/>
  <!-- Toe cap -->
  <path d="M610 170 Q650 200 660 260 Q670 300 670 350 Q670 380 665 400 L635 400 Q635 300 615 250Z" fill="#d4d4d4"/>
  <!-- Mesh pattern -->
  <path d="M320 220 Q380 180 480 180" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M310 260 Q380 220 500 220" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M300 300 Q380 260 520 270" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <path d="M290 340 Q380 300 540 320" stroke="#d4d4d4" stroke-width="1.5" fill="none"/>
  <!-- Three Stripes -->
  <rect x="260" y="340" width="280" height="6" rx="3" fill="url(#stripe)"/>
  <rect x="270" y="358" width="280" height="6" rx="3" fill="url(#stripe)"/>
  <rect x="280" y="376" width="280" height="6" rx="3" fill="url(#stripe)"/>
  <!-- Heel cage -->
  <path d="M190 280 Q185 340 190 420" stroke="#404040" stroke-width="3" fill="none"/>
  <path d="M220 270 Q215 330 220 430" stroke="#404040" stroke-width="3" fill="none"/>
  <!-- Collar -->
  <path d="M160 200 Q170 155 210 135 L240 200Z" fill="#d4d4d4"/>
  <!-- Tongue -->
  <path d="M340 115 Q360 75 390 72 Q420 70 440 78 Q460 88 460 108 L460 150 Q440 140 400 140 Q360 140 340 150Z" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Eyelets -->
  <circle cx="315" cy="185" r="5" fill="#d1d5db"/>
  <circle cx="335" cy="205" r="5" fill="#d1d5db"/>
  <circle cx="355" cy="225" r="5" fill="#d1d5db"/>
  <circle cx="375" cy="245" r="5" fill="#d1d5db"/>
  <circle cx="395" cy="265" r="5" fill="#d1d5db"/>
  <!-- Laces -->
  <path d="M315 185 L385 175" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M335 205 L395 195" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M355 225 L405 215" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M375 245 L415 235" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M395 265 L435 255" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <!-- Text -->
  <text x="400" y="468" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#1e1e1e" text-anchor="middle" letter-spacing="6">ADIDAS</text>
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="4">ULTRABOOST</text>
</svg>
