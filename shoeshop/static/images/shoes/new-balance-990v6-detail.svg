<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <pattern id="meshDetail" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#c0c0c0" stroke-width="0.5"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#c0c0c0" stroke-width="0.5"/>
      <circle cx="4" cy="4" r="1" fill="#d0d0d0"/>
    </pattern>
    <pattern id="suedeTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#737373" opacity="0.08"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#999" stroke-width="0.3"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="#f9fafb"/>

  <!-- Mesh pattern background area -->
  <rect x="80" y="250" width="640" height="300" rx="20" fill="url(#meshDetail)" opacity="0.15"/>

  <!-- Suede texture background -->
  <rect x="80" y="250" width="640" height="300" rx="20" fill="url(#suedeTexture)"/>

  <!-- Large NB icon -->
  <g filter="url(#glow)">
    <!-- N letterform - large iconic -->
    <path d="M300 180 L300 520 L370 520 L370 300 L370 280 L440 520 L500 520 L500 180 L430 180 L430 400 L430 420 L360 180 Z" fill="url(#redAccent)"/>
  </g>

  <!-- Mesh detail behind N -->
  <rect x="340" y="200" width="50" height="280" rx="10" fill="url(#meshDetail)" opacity="0.3"/>

  <!-- Suede texture hint overlay -->
  <path d="M180 520 Q400 480 620 520" stroke="#737373" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M190 540 Q400 505 610 540" stroke="#737373" stroke-width="0.8" fill="none" opacity="0.15"/>

  <!-- 990v6 text -->
  <text x="400" y="600" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#737373" text-anchor="middle" letter-spacing="8">990v6</text>

  <!-- MADE IN USA -->
  <text x="400" y="650" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af" text-anchor="middle" letter-spacing="10">MADE IN USA</text>

  <!-- NEW BALANCE brand name -->
  <text x="400" y="700" font-family="Arial, sans-serif" font-size="14" fill="#d1d5db" text-anchor="middle" letter-spacing="6">NEW BALANCE</text>

  <!-- Decorative stitching pattern -->
  <path d="M120 440 L200 420 L200 460 L120 480" stroke="#c0c0c0" stroke-width="1" fill="none" stroke-dasharray="5,3" opacity="0.5"/>
  <path d="M680 440 L600 420 L600 460 L680 480" stroke="#c0c0c0" stroke-width="1" fill="none" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Premium dots -->
  <circle cx="400" cy="720" r="3" fill="#dc2626" opacity="0.4"/>
  <circle cx="400" cy="740" r="3" fill="#dc2626" opacity="0.3"/>
  <circle cx="400" cy="760" r="3" fill="#dc2626" opacity="0.2"/>

  <!-- ENCAP indicator -->
  <rect x="300" y="560" width="200" height="4" rx="2" fill="#d1d5db"/>
  <circle cx="400" cy="562" r="5" fill="#dc2626" opacity="0.3"/>
</svg>