<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="stripeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="meshDetail" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#d4d4d4" stroke-width="0.5"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#d4d4d4" stroke-width="0.3"/>
      <circle cx="4" cy="4" r="1" fill="#e2e8f0"/>
    </pattern>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="#f9fafb"/>

  <!-- Mesh pattern background -->
  <rect x="60" y="200" width="680" height="350" rx="20" fill="url(#meshDetail)" opacity="0.2"/>

  <!-- Large ASICS text -->
  <g filter="url(#glowBlue)">
    <text x="400" y="320" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#stripeGrad)" text-anchor="middle" letter-spacing="12">ASICS</text>
  </g>

  <!-- GEL capsule graphic (decorative) -->
  <ellipse cx="230" cy="370" rx="60" ry="35" fill="url(#gelGrad)" stroke="#0284c7" stroke-width="2" opacity="0.7"/>
  <ellipse cx="230" cy="367" rx="30" ry="16" fill="#bae6fd" opacity="0.5"/>

  <ellipse cx="570" cy="370" rx="60" ry="35" fill="url(#gelGrad)" stroke="#0284c7" stroke-width="2" opacity="0.7"/>
  <ellipse cx="570" cy="367" rx="30" ry="16" fill="#bae6fd" opacity="0.5"/>

  <!-- GEL-KAYANO 30 text -->
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#475569" text-anchor="middle" letter-spacing="6">GEL-KAYANO 30</text>

  <!-- FlyteFoam label -->
  <rect x="330" y="470" width="140" height="28" rx="14" fill="url(#stripeGrad)" opacity="0.8"/>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="4">FlyteFoam</text>

  <!-- Tiger stripe decorative -->
  <path d="M200 540 L260 510 L300 550 L240 580 Z" fill="url(#stripeGrad)" opacity="0.6"/>
  <path d="M250 560 L310 530 L350 570 L290 600 Z" fill="url(#stripeGrad)" opacity="0.4"/>
  <path d="M300 580 L360 550 L400 590 L340 620 Z" fill="url(#stripeGrad)" opacity="0.25"/>

  <path d="M600 540 L540 510 L500 550 L560 580 Z" fill="url(#stripeGrad)" opacity="0.6"/>
  <path d="M550 560 L490 530 L450 570 L510 600 Z" fill="url(#stripeGrad)" opacity="0.4"/>
  <path d="M500 580 L440 550 L400 590 L460 620 Z" fill="url(#stripeGrad)" opacity="0.25"/>

  <!-- 4D Guidance hint -->
  <path d="M280 640 Q400 620 520 640" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.3"/>
  <text x="400" y="670" font-family="Arial, sans-serif" font-size="11" fill="#6366f1" text-anchor="middle" letter-spacing="6" opacity="0.5">4D GUIDANCE SYSTEM</text>

  <!-- Decorative line -->
  <line x1="200" y1="700" x2="600" y2="700" stroke="#e2e8f0" stroke-width="1"/>
</svg>