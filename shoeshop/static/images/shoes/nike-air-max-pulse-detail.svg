<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#f9fafb"/></linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>
  <!-- Mesh background texture -->
  <circle cx="100" cy="100" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="300" cy="80" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="500" cy="120" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="150" cy="300" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="650" cy="200" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="700" cy="500" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="100" cy="600" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="200" cy="700" r="2" fill="#d4d4d4" opacity="0.3"/>
  <circle cx="600" cy="700" r="2" fill="#d4d4d4" opacity="0.3"/>
  <!-- Large swoosh -->
  <path d="M200 300 Q320 160 520 120 Q620 100 700 130 Q660 150 580 190 Q460 250 340 340 Q250 410 200 300Z" fill="url(#swoosh)"/>
  <!-- "AIR" text inside swoosh area -->
  <text x="400" y="340" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="12">AIR</text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="28" font-weight="300" fill="#ef4444" text-anchor="middle" letter-spacing="8">MAX</text>
  <!-- NIKE text large -->
  <text x="400" y="520" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="16">NIKE</text>
  <!-- Air Max capsule detail -->
  <rect x="350" y="560" width="100" height="40" rx="20" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="586" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">AIR MAX</text>
  <text x="400" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="8">AIR MAX PULSE</text>
</svg>
