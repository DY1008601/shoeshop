<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="upperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="midsoleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="660" rx="200" ry="30" fill="url(#shadowGrad)"/>

  <g filter="url(#dropShadow)" transform="translate(100, 40) rotate(-5, 300, 340)">
    <!-- Outsole -->
    <path d="M60,580 Q40,585 30,570 L30,555 Q40,548 50,548 L540,548 Q555,548 565,555 L565,570 Q560,585 540,580 Z" fill="#1e3a5f"/>

    <!-- Extra thick midsole (HOKA signature) -->
    <path d="M35,430 Q20,440 15,490 L15,550 Q40,545 50,548 L540,548 Q555,545 580,550 L580,480 Q565,440 550,430 Z" fill="url(#midsoleGrad)"/>

    <!-- Midsole lower band -->
    <path d="M30,500 L30,550 Q40,545 50,548 L540,548 Q555,545 580,550 L580,500 Q550,490 540,492 L50,492 Q40,490 30,500 Z" fill="#1d4ed8" opacity="0.5"/>

    <!-- Yellow accent line on midsole -->
    <path d="M40,470 Q35,475 40,480 L560,480 Q565,475 560,470 Q550,465 540,467 L60,467 Q45,465 40,470 Z" fill="#f59e0b"/>

    <!-- Yellow accent line 2 -->
    <path d="M45,525 Q38,530 43,535 L563,535 Q568,530 563,525 Q553,520 543,522 L57,522 Q48,520 45,525 Z" fill="#f59e0b" opacity="0.5"/>

    <!-- Upper body -->
    <path d="M45,420 L45,250 Q48,170 120,130 Q180,98 250,90 Q320,82 390,88 Q460,95 515,125 Q545,150 555,200 L555,420 Z" fill="url(#upperGrad)"/>

    <!-- Engineered mesh pattern -->
    <g fill="none" stroke="#93c5fd" stroke-width="0.8" opacity="0.4">
      <line x1="100" y1="250" x2="520" y2="250"/>
      <line x1="90" y1="280" x2="530" y2="280"/>
      <line x1="80" y1="310" x2="535" y2="310"/>
      <line x1="75" y1="340" x2="540" y2="340"/>
      <line x1="70" y1="370" x2="545" y2="370"/>
      <line x1="65" y1="400" x2="550" y2="400"/>
    </g>

    <!-- Toe cap -->
    <path d="M45,420 Q40,360 70,300 Q85,265 110,235 Q125,220 150,205 Q170,195 190,190" fill="none" stroke="#93c5fd" stroke-width="1.2" opacity="0.5"/>

    <!-- HOKA bird logo stripe -->
    <path d="M120,260 Q160,230 220,210 Q280,192 340,195 Q400,200 460,215 Q500,228 520,250 L530,320 Q490,305 440,290 Q380,275 320,280 Q260,288 200,305 Q150,320 115,345 Z" fill="#2563eb" opacity="0.85"/>

    <!-- Bird logo highlight -->
    <path d="M130,265 Q165,240 220,220 Q275,205 335,208 Q390,212 445,225 Q480,236 500,255 L510,310 Q475,298 430,286 Q375,272 320,276 Q265,282 210,296 Q160,310 128,332 Z" fill="#3b82f6" opacity="0.4"/>

    <!-- Tongue -->
    <path d="M240,85 Q250,65 270,58 Q290,54 310,58 Q330,62 340,85 L350,130 Q340,125 310,120 Q280,117 250,120 Q240,122 235,128 Z" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>

    <!-- Lace system -->
    <g fill="none" stroke="#2563eb" stroke-width="2" opacity="0.6">
      <path d="M220,140 Q250,152 285,145"/>
      <path d="M210,168 Q250,182 295,172"/>
      <path d="M205,196 Q250,212 300,198"/>
      <path d="M200,224 Q250,242 305,226"/>
      <path d="M195,252 Q250,272 310,254"/>
      <path d="M190,280 Q250,302 315,282"/>
    </g>

    <!-- Eyelets -->
    <g fill="#1d4ed8" opacity="0.5">
      <circle cx="215" cy="142" r="3.5"/>
      <circle cx="290" cy="147" r="3.5"/>
      <circle cx="207" cy="170" r="3.5"/>
      <circle cx="298" cy="174" r="3.5"/>
      <circle cx="202" cy="198" r="3.5"/>
      <circle cx="303" cy="200" r="3.5"/>
      <circle cx="197" cy="226" r="3.5"/>
      <circle cx="308" cy="228" r="3.5"/>
      <circle cx="192" cy="254" r="3.5"/>
      <circle cx="313" cy="256" r="3.5"/>
      <circle cx="187" cy="282" r="3.5"/>
      <circle cx="318" cy="284" r="3.5"/>
    </g>

    <!-- Heel counter -->
    <path d="M515,125 Q535,170 545,220 Q552,280 550,340 L530,340 Q530,290 525,240 Q520,190 510,150 Z" fill="#bae6fd" opacity="0.4"/>

    <!-- Collar line -->
    <path d="M250,90 Q300,78 350,80 Q400,85 450,95 Q500,110 520,135" fill="none" stroke="#93c5fd" stroke-width="1.2"/>
  </g>

  <text x="400" y="750" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="#1e1e1e" text-anchor="middle">HOKA Clifton 9</text>
  <text x="400" y="775" font-family="Arial,sans-serif" font-weight="400" font-size="12" fill="#9ca3af" text-anchor="middle">Running Shoe — 3/4 Angle View</text>
</svg>