<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="upperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="midsoleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nitroAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="620" rx="140" ry="22" fill="url(#shadowGrad)"/>

  <!-- Heel view -->
  <g transform="translate(400, 170)">
    <!-- Outsole -->
    <ellipse cx="0" cy="440" rx="95" ry="22" fill="#374151"/>
    <rect x="-95" y="440" width="190" height="10" fill="#374151"/>

    <!-- Midsole -->
    <path d="M-90,440 L-90,330 Q-90,310 -80,300 L80,300 Q90,310 90,330 L90,440 Z" fill="url(#midsoleGrad)"/>

    <!-- Midsole texture lines -->
    <g fill="none" stroke="#ea580c" stroke-width="0.8" opacity="0.4">
      <line x1="-85" y1="350" x2="85" y2="350"/>
      <line x1="-87" y1="370" x2="87" y2="370"/>
      <line x1="-88" y1="390" x2="88" y2="390"/>
      <line x1="-89" y1="410" x2="89" y2="410"/>
      <line x1="-90" y1="430" x2="90" y2="430"/>
    </g>

    <!-- NITRO foam speckle dots on midsole -->
    <g fill="#fbbf24" opacity="0.6">
      <circle cx="-40" cy="340" r="2.5"/>
      <circle cx="30" cy="355" r="3"/>
      <circle cx="-60" cy="370" r="2"/>
      <circle cx="50" cy="380" r="3.5"/>
      <circle cx="-20" cy="395" r="2.5"/>
      <circle cx="60" cy="410" r="2"/>
      <circle cx="-50" cy="420" r="3"/>
      <circle cx="40" cy="430" r="2.5"/>
      <circle cx="-70" cy="360" r="2"/>
      <circle cx="70" cy="385" r="3"/>
      <circle cx="0" cy="345" r="2"/>
    </g>

    <!-- Upper body -->
    <path d="M-80,300 Q-80,240 -75,200 Q-70,160 -60,130 Q-45,100 -20,85 Q0,75 20,85 Q45,100 60,130 Q70,160 75,200 Q80,240 80,300 Z" fill="url(#upperGrad)"/>

    <!-- Heel counter shape -->
    <path d="M-70,300 L-70,240 Q-65,190 -55,150 Q-40,110 -15,95 Q0,85 15,95 Q40,110 55,150 Q65,190 70,240 L70,300 Z" fill="#f3f4f6" opacity="0.5"/>

    <!-- Collar opening -->
    <ellipse cx="0" cy="110" rx="42" ry="18" fill="#1e1e1e"/>

    <!-- Collar padding ring -->
    <ellipse cx="0" cy="110" rx="55" ry="25" fill="none" stroke="#d1d5db" stroke-width="2"/>

    <!-- Pull tab -->
    <rect x="-8" y="55" width="16" height="30" rx="8" fill="#e5e5e5" stroke="#d1d5db" stroke-width="1"/>

    <!-- Puma cat logo hint on heel -->
    <g transform="translate(0, 180)" opacity="0.3">
      <path d="M-15,-10 L-25,10 L-20,5 L-15,15 L-10,5 L-5,15 L0,5 L5,15 L10,5 L15,15 L20,5 L25,10 L15,-10 Z" fill="#1e1e1e"/>
    </g>

    <!-- VELOCITY NITRO text on heel counter -->
    <text x="0" y="260" font-family="Arial,sans-serif" font-weight="900" font-size="9" fill="#4b5563" text-anchor="middle" letter-spacing="2">VELOCITY NITRO</text>

    <!-- Center stitch line -->
    <line x1="0" y1="130" x2="0" y2="285" stroke="#d1d5db" stroke-width="1" opacity="0.5"/>
  </g>

  <text x="400" y="750" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="#1e1e1e" text-anchor="middle">PUMA Velocity NITRO 3</text>
  <text x="400" y="775" font-family="Arial,sans-serif" font-weight="400" font-size="12" fill="#9ca3af" text-anchor="middle">Running Shoe — Heel View</text>
</svg>