<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="formstripGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="nitroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="nitroPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
      <feComposite in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>

  <!-- Top dark banner -->
  <rect x="32" y="32" width="736" height="140" rx="32" fill="url(#darkBg)"/>

  <!-- Large PUMA text -->
  <text x="400" y="120" font-family="Arial,sans-serif" font-weight="900" font-size="72" fill="#fff" text-anchor="middle" letter-spacing="8">PUMA</text>

  <!-- Large Formstrip graphic -->
  <g transform="translate(400, 280)">
    <path d="M-220,-40 Q-180,-60 -100,-68 Q-20,-75 80,-65 Q140,-58 180,-45 L200,20 Q140,10 80,0 Q-20,-8 -100,5 Q-180,15 -220,35 Z" fill="url(#formstripGrad)"/>
    <path d="M-200,-30 Q-160,-48 -90,-55 Q-20,-60 80,-52 Q130,-46 165,-35 L180,15 Q130,5 80,-2 Q-20,-8 -90,5 Q-160,15 -200,28 Z" fill="#6b7280" opacity="0.3"/>
  </g>

  <!-- VELOCITY NITRO 3 subtitle -->
  <text x="400" y="400" font-family="Arial,sans-serif" font-weight="900" font-size="28" fill="#1e1e1e" text-anchor="middle" letter-spacing="3">VELOCITY NITRO 3</text>

  <!-- NITRO foam graphic panel -->
  <rect x="160" y="440" width="480" height="90" rx="16" fill="url(#nitroPanel)" opacity="0.9"/>

  <!-- Orange dots representing NITRO foam -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="200" cy="475" r="6"/>
    <circle cx="240" cy="460" r="5"/>
    <circle cx="280" cy="490" r="7"/>
    <circle cx="320" cy="470" r="5.5"/>
    <circle cx="360" cy="455" r="6"/>
    <circle cx="400" cy="485" r="7"/>
    <circle cx="440" cy="465" r="5"/>
    <circle cx="480" cy="495" r="6.5"/>
    <circle cx="520" cy="475" r="5"/>
    <circle cx="560" cy="460" r="6"/>
    <circle cx="600" cy="490" r="5.5"/>
    <circle cx="220" cy="445" r="4"/>
    <circle cx="340" cy="505" r="4.5"/>
    <circle cx="460" cy="450" r="4"/>
    <circle cx="580" cy="505" r="4.5"/>
  </g>

  <!-- NITRO label on panel -->
  <text x="400" y="502" font-family="Arial,sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle" letter-spacing="4">NITRO FOAM</text>

  <!-- PUMAGRIP badge -->
  <rect x="290" y="570" width="220" height="55" rx="27" fill="#374151"/>
  <text x="400" y="605" font-family="Arial,sans-serif" font-weight="900" font-size="20" fill="#d1d5db" text-anchor="middle" letter-spacing="3">PUMAGRIP</text>

  <!-- Decorative dots -->
  <g fill="#f97316" opacity="0.3">
    <circle cx="150" cy="200" r="4"/>
    <circle cx="650" cy="180" r="3"/>
    <circle cx="180" cy="350" r="2.5"/>
    <circle cx="620" cy="380" r="3.5"/>
    <circle cx="200" cy="550" r="3"/>
    <circle cx="600" cy="530" r="2.5"/>
    <circle cx="130" cy="450" r="2"/>
    <circle cx="670" cy="450" r="2.5"/>
  </g>

  <text x="400" y="700" font-family="Arial,sans-serif" font-weight="400" font-size="12" fill="#9ca3af" text-anchor="middle">Running Shoe — Brand Detail</text>
</svg>