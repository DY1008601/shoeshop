  <path d="M270 240 L420 220 Q520 200 600 190 L590 220 Q510 230 420 250 L270 270 Z" fill="url(#formstrip)"/>
  <!-- Collar -->
  <path d="M160 200 Q170 155 210 135 L240 200Z" fill="#d4d4d4"/>
