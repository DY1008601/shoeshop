  <path d="M210 390 Q220 370 230 390" stroke="#1e1e1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="400" y="466" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#1e1e1e" text-anchor="middle" letter-spacing="8">PUMA</text>
  <text x="400" y="498" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="4">VELOCITY NITRO</text>
