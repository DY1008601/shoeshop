<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="soleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="heelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="forefootTread" width="14" height="6" patternUnits="userSpaceOnUse">
      <rect width="14" height="6" fill="none"/>
      <line x1="0" y1="3" x2="14" y2="3" stroke="#94a3b8" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="800" height="800" rx="32" fill="#f9fafb"/>

  <!-- Outsole shape -->
  <path d="M210 170 Q190 280 190 410 Q190 550 250 605 Q320 640 400 645 Q490 640 560 600 Q610 545 610 410 Q610 280 590 170 Q530 145 400 140 Q270 145 210 170 Z" fill="url(#soleGrad)" stroke="#94a3b8" stroke-width="2"/>

  <!-- AHAR+ heel -->
  <path d="M190 490 Q190 550 250 605 Q320 640 400 645 Q490 640 560 600 Q610 545 610 490 Z" fill="url(#heelGrad)" stroke="#334155" stroke-width="1"/>

  <!-- Guidance Line center groove -->
  <path d="M400 165 Q400 250 400 630" stroke="#475569" stroke-width="2.5" fill="none"/>

  <!-- Trusstic System arch plate -->
  <path d="M310 380 L490 380 L500 460 L300 460 Z" fill="#64748b" stroke="#475569" stroke-width="1" opacity="0.7"/>

  <!-- GEL window heel -->
  <ellipse cx="530" cy="520" rx="35" ry="22" fill="url(#gelGrad)" stroke="#0284c7" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="530" cy="520" rx="20" ry="12" fill="#7dd3fc" opacity="0.4"/>
  <ellipse cx="270" cy="520" rx="35" ry="22" fill="url(#gelGrad)" stroke="#0284c7" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="270" cy="520" rx="20" ry="12" fill="#7dd3fc" opacity="0.4"/>

  <!-- Forefoot tread horizontal -->
  <rect x="220" y="200" width="360" height="100" rx="30" fill="url(#forefootTread)" opacity="0.5"/>

  <!-- Flex grooves -->
  <path d="M260 220 Q400 210 540 220" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <path d="M260 240 Q400 230 540 240" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <path d="M260 260 Q400 250 540 260" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <path d="M260 280 Q400 270 540 280" stroke="#94a3b8" stroke-width="1" fill="none"/>

  <!-- Trusstic System label -->
  <rect x="340" y="395" width="120" height="18" rx="4" fill="#475569"/>
  <text x="400" y="408" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle" letter-spacing="2">TRUSSTIC</text>

  <!-- AHAR+ label -->
  <rect x="340" y="560" width="120" height="20" rx="4" fill="#334155"/>
  <text x="400" y="574" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle" letter-spacing="2">AHAR+</text>

  <!-- Midfoot tread -->
  <path d="M280 340 Q400 330 520 340" stroke="#94a3b8" stroke-width="1" fill="none"/>
  <path d="M270 360 Q400 350 530 360" stroke="#94a3b8" stroke-width="1" fill="none"/>

  <!-- Brand text -->
  <text x="400" y="620" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="4">ASICS</text>
  <text x="400" y="638" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1">GEL-KAYANO 30</text>
</svg>