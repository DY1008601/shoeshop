<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#e5e5e5"/></linearGradient>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#9ca3af"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="midsole" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d1d5db"/><stop offset="100%" stop-color="#a3a3a3"/></linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <ellipse cx="400" cy="720" rx="100" ry="14" fill="rgba(0,0,0,0.08)"/>
  <!-- Outsole bottom -->
  <path d="M280 680 Q340 700 400 700 Q460 700 520 680 Q540 660 540 630 L260 630 Q260 660 280 680Z" fill="url(#sole)"/>
  <!-- Midsole from rear -->
  <path d="M260 630 L540 630 Q560 590 560 550 L240 550 Q240 590 260 630Z" fill="url(#midsole)"/>
  <!-- Air Max capsule (center of heel) -->
  <ellipse cx="400" cy="590" rx="55" ry="24" fill="url(#air)"/>
  <ellipse cx="400" cy="590" rx="38" ry="15" fill="#fca5a5" opacity="0.5"/>
  <text x="400" y="596" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">AIR MAX</text>
  <!-- Upper heel -->
  <path d="M240 550 Q250 460 260 380 Q265 340 270 300 L530 300 Q535 340 540 380 Q550 460 560 550Z" fill="url(#body)"/>
  <!-- Heel counter plastic -->
  <path d="M280 380 Q275 410 265 460 Q260 490 260 520 Q300 540 400 540 Q500 540 540 520 Q540 490 535 460 Q525 410 520 380" fill="#e5e5e5" stroke="#d4d4d4" stroke-width="2"/>
  <!-- NIKE text on heel -->
  <text x="400" y="450" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="4">NIKE</text>
  <!-- Collar opening (rear) -->
  <path d="M300 310 Q350 280 400 275 Q450 280 500 310" stroke="#d4d4d4" stroke-width="4" fill="none"/>
  <!-- Pull tab -->
  <path d="M370 275 Q400 260 430 275" stroke="#e5e5e5" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Swoosh on heel -->
  <path d="M430 410 Q460 390 510 400" stroke="#ef4444" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Stitching lines -->
  <path d="M300 480 Q400 500 500 480" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="6,4" fill="none"/>
  <path d="M310 510 Q400 530 490 510" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="6,4" fill="none"/>
  <!-- REFLEX logo on heel -->
  <circle cx="400" cy="420" r="8" fill="#ef4444" opacity="0.3"/>
  <text x="400" y="700" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="middle">HEEL VIEW</text>
</svg>
