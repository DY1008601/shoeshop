<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="meshTop" width="6" height="12" patternUnits="userSpaceOnUse">
      <rect width="6" height="12" fill="none"/>
      <line x1="0" y1="6" x2="6" y2="6" stroke="#d4d4d4" stroke-width="0.5"/>
      <line x1="3" y1="0" x2="3" y2="12" stroke="#d4d4d4" stroke-width="0.3"/>
    </pattern>
  </defs>

  <rect width="800" height="800" rx="32" fill="#f9fafb"/>

  <ellipse cx="400" cy="650" rx="200" ry="28" fill="url(#shadowGrad)"/>

  <!-- Top-down shoe shape -->
  <path d="M160 340 Q140 240 220 190 Q300 160 400 155 Q520 160 600 200 Q660 250 640 350 L640 520 Q660 570 600 600 Q520 620 400 625 Q300 620 220 595 Q160 565 160 520 Z" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Mesh ventilation pattern -->
  <rect x="200" y="240" width="400" height="250" rx="30" fill="url(#meshTop)" opacity="0.4"/>

  <!-- Tiger stripes (left) -->
  <g transform="rotate(-12, 250, 360)">
    <path d="M220 300 L270 310 L260 430 L210 420 Z" fill="url(#stripeGrad)" opacity="0.7"/>
    <path d="M240 320 L290 330 L280 450 L230 440 Z" fill="url(#stripeGrad)" opacity="0.5"/>
    <path d="M260 340 L310 350 L300 470 L250 460 Z" fill="url(#stripeGrad)" opacity="0.35"/>
  </g>

  <!-- Tiger stripes (right) -->
  <g transform="rotate(12, 550, 360)">
    <path d="M530 310 L580 300 L590 420 L540 430 Z" fill="url(#stripeGrad)" opacity="0.7"/>
    <path d="M510 330 L560 320 L570 440 L520 450 Z" fill="url(#stripeGrad)" opacity="0.5"/>
    <path d="M490 350 L540 340 L550 460 L500 470 Z" fill="url(#stripeGrad)" opacity="0.35"/>
  </g>

  <!-- Tongue center -->
  <path d="M350 290 Q370 270 400 265 Q430 270 450 290 L460 440 Q430 455 400 458 Q370 455 340 440 Z" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Tongue label -->
  <rect x="375" y="285" width="50" height="16" rx="3" fill="#0ea5e9"/>
  <text x="400" y="297" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">ASICS</text>

  <!-- Left eyelets -->
  <circle cx="325" cy="315" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="315" cy="345" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="310" cy="375" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="307" cy="405" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Right eyelets -->
  <circle cx="475" cy="315" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="485" cy="345" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="490" cy="375" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="493" cy="405" r="5" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Laces -->
  <line x1="325" y1="315" x2="475" y2="315" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="315" y1="345" x2="485" y2="345" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="310" y1="375" x2="490" y2="375" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="307" y1="405" x2="493" y2="405" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Toe perf holes -->
  <circle cx="240" cy="260" r="2" fill="#94a3b8"/>
  <circle cx="260" cy="250" r="2" fill="#94a3b8"/>
  <circle cx="280" cy="243" r="2" fill="#94a3b8"/>
  <circle cx="300" cy="238" r="2" fill="#94a3b8"/>
  <circle cx="320" cy="235" r="2" fill="#94a3b8"/>
  <circle cx="340" cy="233" r="2" fill="#94a3b8"/>

  <circle cx="460" cy="233" r="2" fill="#94a3b8"/>
  <circle cx="480" cy="235" r="2" fill="#94a3b8"/>
  <circle cx="500" cy="238" r="2" fill="#94a3b8"/>
  <circle cx="520" cy="243" r="2" fill="#94a3b8"/>
  <circle cx="540" cy="250" r="2" fill="#94a3b8"/>
  <circle cx="560" cy="260" r="2" fill="#94a3b8"/>

  <!-- Stitching -->
  <path d="M220 280 Q400 245 580 280" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <path d="M215 450 Q400 470 585 450" stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="4,3"/>

  <!-- Midsole edge visible -->
  <path d="M160 520 Q300 625 400 628 Q500 625 640 520" stroke="white" stroke-width="3" fill="none"/>
  <path d="M160 522 Q300 630 400 633 Q500 630 640 522" stroke="#e2e8f0" stroke-width="2" fill="none"/>

  <!-- Collar opening -->
  <ellipse cx="400" cy="435" rx="42" ry="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
</svg>