<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <pattern id="meshOn" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="2" cy="2" r="0.6" fill="#d0d0d0"/>
    </pattern>
  </defs>

  <rect width="800" height="800" rx="32" fill="#f9fafb"/>

  <!-- Main heel shape -->
  <path d="M280 200 Q400 165 520 200 L545 480 Q400 515 255 480 Z" fill="url(#bodyGrad)" stroke="#d4d4d4" stroke-width="1.5"/>

  <!-- Heel counter -->
  <path d="M295 200 Q320 190 400 185 Q480 190 505 200 L510 440 Q400 465 290 440 Z" fill="url(#meshOn)" opacity="0.3"/>

  <!-- ON logo / Swiss flag -->
  <circle cx="400" cy="350" r="3" fill="#22c55e" opacity="0.3"/>

  <!-- Collar opening -->
  <ellipse cx="400" cy="210" rx="80" ry="24" fill="#d4d4d4" stroke="#c0c0c0" stroke-width="1.5"/>
  <ellipse cx="400" cy="213" rx="68" ry="18" fill="#c8c8c8" stroke="#b0b0b0" stroke-width="1"/>

  <!-- Pull tab -->
  <path d="M370 190 Q360 172 365 165 Q375 158 382 165 Q390 178 400 188 Q410 178 418 165 Q425 158 435 165 Q440 172 430 190" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.7"/>

  <!-- CloudTec pods at bottom (segmented) -->
  <rect x="275" y="480" width="250" height="18" rx="9" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="0.8"/>
  <rect x="278" y="498" width="244" height="16" rx="8" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="0.8"/>

  <!-- Pod segmentation lines -->
  <line x1="330" y1="480" x2="330" y2="498" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="380" y1="480" x2="380" y2="498" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="420" y1="480" x2="420" y2="498" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="470" y1="480" x2="470" y2="498" stroke="#d4d4d4" stroke-width="1"/>

  <!-- Heel shape definition -->
  <path d="M255 480 Q230 440 230 400 Q230 300 280 220" stroke="#d4d4d4" stroke-width="1" fill="none"/>
  <path d="M545 480 Q570 440 570 400 Q570 300 520 220" stroke="#d4d4d4" stroke-width="1" fill="none"/>

  <!-- Stitching -->
  <path d="M310 250 Q400 230 490 250" stroke="#d4d4d4" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <path d="M305 290 Q400 270 495 290" stroke="#d4d4d4" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <path d="M300 330 Q400 310 500 330" stroke="#d4d4d4" stroke-width="1" fill="none" stroke-dasharray="4,3"/>

  <!-- Green accent line bottom -->
  <path d="M260 460 L540 460" stroke="#22c55e" stroke-width="2" fill="none"/>
</svg>