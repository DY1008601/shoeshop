<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="suede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3a3a3"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <ellipse cx="380" cy="700" rx="260" ry="24" fill="rgba(0,0,0,0.08)"/>
  <!-- Sole -->
  <path d="M140 620 Q140 665 190 665 L560 665 Q630 665 630 635 Q630 595 620 585 L610 620 L140 620Z" fill="url(#sole)"/>
  <path d="M140 620 L610 620 Q620 595 630 585 L630 565 L140 565Z" fill="url(#sole)"/>
  <!-- ENCAP midsole -->
  <path d="M140 565 L630 565 Q650 545 650 500 L140 500Z" fill="#d1d5db"/>
  <!-- Gray stripe accent in midsole -->
  <rect x="140" y="520" width="510" height="4" fill="#9ca3af" rx="2"/>
  <!-- Heel -->
  <path d="M140 190 Q130 300 135 370 Q140 440 140 500 L250 500 Q250 400 240 260 Q235 210 230 190Z" fill="url(#body)"/>
  <!-- Suede overlay heel -->
  <path d="M140 190 Q130 280 135 340 Q140 400 140 460 L230 460 Q230 380 225 300 Q222 240 220 190Z" fill="url(#suede)"/>
  <!-- Upper -->
  <path d="M220 190 Q240 150 280 130 Q360 100 460 110 Q540 120 600 160 Q640 190 650 250 Q660 290 660 340 Q660 440 650 500 L140 500 Q140 400 135 370 Q140 300 140 190Z" fill="url(#body)"/>
  <!-- Toe box suede -->
  <path d="M600 160 Q640 190 650 250 Q660 290 660 340 Q660 380 655 400 L620 400 Q620 300 600 250Z" fill="url(#suede)"/>
  <!-- Mesh panels -->
  <path d="M300 210 Q360 170 460 170" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <path d="M290 250 Q360 210 480 210" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <path d="M280 290 Q360 250 500 270" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <path d="M270 330 Q360 290 520 320" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <!-- NB N logo -->
  <path d="M460 230 L480 310 L500 230 L520 310 L540 230" stroke="url(#accent)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 990 text on heel -->
  <text x="170" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#737373" text-anchor="middle">990</text>
  <!-- Collar -->
  <path d="M140 190 Q150 145 190 125 L220 190Z" fill="#c4c4c4"/>
  <!-- Tongue -->
  <path d="M330 105 Q350 65 380 62 Q410 60 430 68 Q450 78 450 98 L450 140 Q430 130 390 130 Q350 130 330 140Z" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1"/>
  <!-- Eyelets -->
  <circle cx="305" cy="175" r="5" fill="#d1d5db"/>
  <circle cx="325" cy="195" r="5" fill="#d1d5db"/>
  <circle cx="345" cy="215" r="5" fill="#d1d5db"/>
  <circle cx="365" cy="235" r="5" fill="#d1d5db"/>
  <circle cx="385" cy="255" r="5" fill="#d1d5db"/>
  <!-- Laces -->
  <path d="M305 175 L375 165" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M325 195 L385 185" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M345 215 L395 205" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M365 235 L405 225" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M385 255 L425 245" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <!-- Text -->
  <text x="390" y="462" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#404040" text-anchor="middle" letter-spacing="3">NEW BALANCE</text>
  <text x="390" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="4">990v6</text>
</svg>
