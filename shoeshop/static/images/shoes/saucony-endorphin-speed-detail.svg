<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="redBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="orangePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#bgGrad)"/>

  <!-- Red banner -->
  <rect x="32" y="32" width="736" height="130" rx="32" fill="url(#redBg)"/>

  <!-- Large SAUCONY text -->
  <text x="400" y="115" font-family="Arial,sans-serif" font-weight="900" font-size="64" fill="#fff" text-anchor="middle" letter-spacing="7">SAUCONY</text>

  <!-- Large river logo graphic -->
  <g transform="translate(400, 260) scale(2)">
    <path d="M-35,-8 Q-25,-25 -12,-35 Q0,-42 12,-35 Q25,-25 35,-8 Q22,4 12,15 Q0,8 -12,15 Q-22,4 -35,-8 Z" fill="url(#riverGrad)" opacity="0.85"/>
    <path d="M-20,-5 Q-14,-16 -6,-22 Q0,-26 6,-22 Q14,-16 20,-5 Q14,3 6,10 Q0,6 -6,10 Q-14,3 -20,-5 Z" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- ENDORPHIN SPEED 4 subtitle -->
  <text x="400" y="365" font-family="Arial,sans-serif" font-weight="900" font-size="28" fill="#1e1e1e" text-anchor="middle" letter-spacing="3">ENDORPHIN SPEED 4</text>

  <!-- SPEEDROLL TECHNOLOGY label -->
  <text x="400" y="400" font-family="Arial,sans-serif" font-weight="400" font-size="14" fill="#6b7280" text-anchor="middle" letter-spacing="5">SPEEDROLL TECHNOLOGY</text>

  <!-- Divider -->
  <line x1="200" y1="425" x2="600" y2="425" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>

  <!-- PWRRUN PB badge panel -->
  <rect x="180" y="455" width="440" height="65" rx="14" fill="url(#orangePanel)" opacity="0.9"/>
  <text x="400" y="497" font-family="Arial,sans-serif" font-weight="900" font-size="20" fill="#fff" text-anchor="middle" letter-spacing="3">PWRRUN PB FOAM</text>

  <!-- Carbon plate illustration -->
  <g transform="translate(400, 580)">
    <!-- Plate shape -->
    <rect x="-120" y="-3" width="240" height="6" rx="3" fill="#ef4444" opacity="0.35"/>
    <rect x="-80" y="-8" width="160" height="16" rx="3" fill="#ef4444" opacity="0.2"/>

    <!-- Plate label -->
    <text x="0" y="-14" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#ef4444" text-anchor="middle" letter-spacing="2">CARBON FIBER PLATE</text>
  </g>

  <!-- Speed indicator lines -->
  <g fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.25">
    <line x1="100" y1="625" x2="300" y2="625"/>
    <line x1="120" y1="640" x2="320" y2="640"/>
    <line x1="140" y1="655" x2="310" y2="655"/>
  </g>

  <!-- Arrow heads -->
  <polygon points="305,622 315,625 305,628" fill="#ef4444" opacity="0.3"/>
  <polygon points="325,637 335,640 325,643" fill="#ef4444" opacity="0.3"/>
  <polygon points="315,652 325,655 315,658" fill="#ef4444" opacity="0.3"/>

  <!-- Decorative dots -->
  <g fill="#ef4444" opacity="0.2">
    <circle cx="120" cy="180" r="3.5"/>
    <circle cx="680" cy="190" r="3"/>
    <circle cx="140" cy="430" r="2.5"/>
    <circle cx="660" cy="440" r="3"/>
    <circle cx="160" cy="550" r="2"/>
    <circle cx="640" cy="545" r="2.5"/>
  </g>

  <!-- Orange dot -->
  <circle cx="400" cy="425" r="4" fill="#f59e0b"/>

  <text x="400" y="710" font-family="Arial,sans-serif" font-weight="400" font-size="12" fill="#9ca3af" text-anchor="middle">Racing Shoe — Brand Detail</text>
</svg>