<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="32" fill="#f9fafb"/>
  <ellipse cx="380" cy="700" rx="260" ry="24" fill="rgba(0,0,0,0.08)"/>
  <!-- Sole -->
  <path d="M140 620 Q140 665 190 665 L570 665 Q635 665 635 635 Q635 595 625 585 L615 620 L140 620Z" fill="url(#sole)"/>
  <path d="M140 620 L615 620 Q625 595 635 585 L635 565 L140 565Z" fill="url(#sole)"/>
  <!-- Thick max-cushion midsole (signature HOKA look) -->
  <path d="M140 565 L635 565 Q650 540 650 490 L140 490Z" fill="#dbeafe"/>
  <!-- Midsole split line -->
  <path d="M140 530 L640 530" stroke="#93c5fd" stroke-width="2" fill="none" stroke-dasharray="8,4"/>
  <!-- Heel (tall due to max cushion) -->
  <path d="M140 190 Q130 290 135 360 Q140 430 140 490 L250 490 Q250 390 240 260 Q235 215 230 190Z" fill="url(#body)"/>
  <!-- Upper -->
  <path d="M230 190 Q245 150 290 130 Q370 100 470 110 Q550 120 610 160 Q650 190 660 250 Q670 290 670 340 Q670 430 660 490 L140 490 Q140 420 135 360 Q140 290 140 190Z" fill="url(#body)"/>
  <!-- Toe cap -->
  <path d="M610 160 Q650 190 660 250 Q670 290 670 340 Q670 370 665 390 L630 390 Q630 290 610 245Z" fill="#bae6fd"/>
  <!-- Engineered mesh -->
  <path d="M320 215 Q380 175 480 175" stroke="#bae6fd" stroke-width="1.5" fill="none"/>
  <path d="M310 255 Q380 215 500 215" stroke="#bae6fd" stroke-width="1.5" fill="none"/>
  <path d="M300 295 Q380 255 520 265" stroke="#bae6fd" stroke-width="1.5" fill="none"/>
  <path d="M290 335 Q380 295 540 315" stroke="#bae6fd" stroke-width="1.5" fill="none"/>
  <!-- HOKA "bird" logo stripe -->
  <path d="M280 260 Q350 230 450 220 Q500 215 560 240" stroke="url(#rocket)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Yellow accent line -->
  <path d="M240 440 Q350 460 500 450 Q580 445 630 430" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <!-- Collar -->
  <path d="M140 190 Q150 145 190 125 L220 190Z" fill="#bae6fd"/>
  <!-- Tongue -->
  <path d="M330 105 Q350 65 380 62 Q410 60 430 68 Q450 78 450 98 L450 140 Q430 130 390 130 Q350 130 330 140Z" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1"/>
  <!-- Eyelets -->
  <circle cx="305" cy="175" r="5" fill="#d1d5db"/>
  <circle cx="325" cy="195" r="5" fill="#d1d5db"/>
  <circle cx="345" cy="215" r="5" fill="#d1d5db"/>
  <circle cx="365" cy="235" r="5" fill="#d1d5db"/>
  <circle cx="385" cy="255" r="5" fill="#d1d5db"/>
  <!-- Laces -->
  <path d="M305 175 L375 165" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M325 195 L385 185" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M345 215 L395 205" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M365 235 L405 225" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <path d="M385 255 L425 245" stroke="#9ca3af" stroke-width="1.5" fill="none"/>
  <!-- Text -->
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#2563eb" text-anchor="middle" letter-spacing="8">HOKA</text>
  <text x="400" y="498" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7280" text-anchor="middle" letter-spacing="4">CLIFTON 9</text>
</svg>
