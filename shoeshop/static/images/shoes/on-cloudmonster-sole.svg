<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="soleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="32" fill="#f9fafb"/>

  <!-- Outsole base shape -->
  <path d="M215 175 Q195 290 195 420 Q195 550 255 605 Q320 640 400 645 Q485 640 550 600 Q605 545 605 420 Q605 290 585 175 Q525 150 400 145 Q275 150 215 175 Z" fill="url(#soleGrad)" stroke="#d4d4d4" stroke-width="1.5"/>

  <!-- CloudTec pod sections - heel area -->
  <rect x="320" y="540" width="160" height="40" rx="20" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="310" y="505" width="180" height="38" rx="19" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="300" y="470" width="200" height="36" rx="18" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>

  <!-- Midfoot pods -->
  <rect x="280" y="435" width="240" height="34" rx="17" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="260" y="400" width="280" height="32" rx="16" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>

  <!-- Forefoot pods -->
  <rect x="245" y="365" width="310" height="30" rx="15" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="235" y="330" width="330" height="28" rx="14" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="225" y="295" width="350" height="26" rx="13" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="220" y="260" width="360" height="24" rx="12" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="218" y="225" width="370" height="22" rx="11" fill="url(#podGrad)" stroke="#d4d4d4" stroke-width="1"/>

  <!-- Green accent stripe on pods -->
  <path d="M280 400 L520 400" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M290 435 L510 435" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M300 470 L500 470" stroke="#22c55e" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- ON text on midfoot pod -->
  <text x="400" y="454" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#a3a3a3" text-anchor="middle" letter-spacing="4">ON</text>

  <!-- CloudTec label -->
  <rect x="320" y="570" width="160" height="18" rx="9" fill="url(#greenAccent)" opacity="0.5"/>
  <text x="400" y="583" font-family="Arial, sans-serif" font-size="8" fill="#166534" text-anchor="middle" letter-spacing="3" font-weight="bold">CloudTec</text>

  <!-- Pod gap lines (emphasized for On signature look) -->
  <path d="M195 235 Q400 225 610 235" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M198 270 Q400 260 610 270" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M200 305 Q400 295 610 305" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M205 340 Q400 330 610 340" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M210 375 Q400 365 610 375" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M218 410 Q400 400 610 410" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M228 445 Q400 435 610 445" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M240 480 Q400 470 610 480" stroke="#d4d4d4" stroke-width="2" fill="none"/>
  <path d="M255 515 Q400 505 610 515" stroke="#d4d4d4" stroke-width="2" fill="none"/>

  <!-- Brand text at bottom -->
  <text x="400" y="630" font-family="Arial, sans-serif" font-size="10" fill="#a3a3a3" text-anchor="middle" letter-spacing="4">ON</text>
  <text x="400" y="645" font-family="Arial, sans-serif" font-size="8" fill="#a3a3a3" text-anchor="middle" letter-spacing="1">CLOUDMONSTER</text>

  <!-- Outline border -->
  <path d="M215 175 Q195 290 195 420 Q195 550 255 605 Q320 640 400 645 Q485 640 550 600 Q605 545 605 420 Q605 290 585 175 Q525 150 400 145 Q275 150 215 175 Z" fill="none" stroke="#d4d4d4" stroke-width="1.5"/>
</svg>