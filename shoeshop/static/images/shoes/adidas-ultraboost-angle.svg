    <linearGradient id="boost" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#d1d5db"/></linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e1e1e"/><stop offset="100%" stop-color="#4b5563"/></linearGradient>
