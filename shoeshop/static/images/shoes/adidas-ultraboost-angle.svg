  <circle cx="335" cy="175" r="5" fill="#d1d5db"/><circle cx="360" cy="200" r="5" fill="#d1d5db"/>
  <circle cx="385" cy="225" r="5" fill="#d1d5db"/><circle cx="410" cy="250" r="5" fill="#d1d5db"/>
  <circle cx="435" cy="275" r="5" fill="#d1d5db"/>
