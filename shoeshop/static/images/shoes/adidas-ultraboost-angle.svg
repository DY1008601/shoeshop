  <rect x="310" y="300" width="260" height="6" rx="3" fill="url(#stripe)" transform="rotate(-8, 440, 303)"/>
  <rect x="320" y="320" width="260" height="6" rx="3" fill="url(#stripe)" transform="rotate(-8, 450, 323)"/>
